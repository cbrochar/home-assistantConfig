substitutions:
  name: "konnected-56accc"
  friendly_name: Mi Casa Alarm Panel 56accc
packages:
  konnected.alarm-panel-esp8266: github://konnected-io/konnected-esphome/alarm-panel-esp8266.yaml@master
esphome:
  name: ${name}
  name_add_mac_suffix: false
