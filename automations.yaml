    - condition: trigger
      id:
      - speaker
      - plate
    - condition: template
      value_template: '{{ trigger.entity_id == states(''input_select.openhasp2_speaker'')
        }}'
  actions:
  - variables:
      pic: '{{ state_attr(states(''input_select.openhasp2_speaker''), ''entity_picture'')
        or '''' }}'
