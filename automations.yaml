- id: '1619321256372'
  alias: Dining_Table
  description: 'Toggle Dining Table: double press on Kitchen Pendant or Kitchen Recessed
    (via MQTT), or single press on the third switch.'
  triggers:
  - trigger: mqtt
    topic: stat/KitchenPendant/RESULT
    value_template: '{{ value_json.Button1.Action if value_json.Button1 is defined
