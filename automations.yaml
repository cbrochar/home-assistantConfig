    to: 'on'
    trigger: state
  - entity_id: binary_sensor.closet_motion
    for:
      minutes: 5
    id: clear
    to: 'off'
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: motion
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.master_closet
    - conditions:
      - condition: trigger
        id: clear
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.master_closet
  mode: queued
