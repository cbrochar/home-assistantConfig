- id: '1794067196822'
  alias: frontdoor_hasp restore theme colors
  description: 'HASPone doesn''t report its theme colors back to Home Assistant, so
    they''re lost on every restart and the HASwitchPlate blueprints fail (blank panel).
    This sets the teal theme again on startup and whenever the plate reconnects: dark
    text on teal buttons, white background when selected/on. Setting a color also
    makes the blueprints repaint their buttons. Don''t use 0,0,0 for black (Home Assistant
    treats it as off); use 0,0,1 instead.'
  triggers:
  - event: start
    trigger: homeassistant
  - entity_id: sensor.frontdoorhasp_sensor
    to: 'ON'
    trigger: state
  actions:
  - delay: 00:00:05
    note: Give MQTT discovery a moment to load the plate's color lights after a restart.
  - action: light.turn_on
    data:
      rgb_color:
      - 0
      - 128
      - 128
    note: Teal button background
    target:
      entity_id: light.frontdoorhasp_unselected_background_color
  - action: light.turn_on
    data:
      rgb_color:
      - 24
      - 24
      - 24
    note: Dark text
    target:
      entity_id: light.frontdoorhasp_unselected_foreground_color
  - action: light.turn_on
    data:
      rgb_color:
      - 255
      - 255
      - 255
    note: White background when selected/on
    target:
      entity_id: light.frontdoorhasp_selected_background_color
  - action: light.turn_on
    data:
      rgb_color:
      - 24
      - 24
      - 24
    note: Dark text when selected/on
    target:
      entity_id: light.frontdoorhasp_selected_foreground_color
  mode: restart
