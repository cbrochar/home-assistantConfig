- id: '1794884108024'
  alias: openhasp2 media lists
  description: Fills the Playlists and Mixes dropdowns on the Living Room openHASP
    media page (page 6) from Music Assistant.
  triggers:
  - event: start
    trigger: homeassistant
  - entity_id: openhasp.openhasp2
    from: unavailable
    trigger: state
  - entity_id: input_boolean.openhasp2_browse
    to: 'on'
    trigger: state
  actions:
  - delay:
      seconds: 5
  - action: music_assistant.get_library
    data:
      config_entry_id: 01M6XSE4DCZ3Z8NPJR9MRAGHMX
      limit: 100
      media_type: playlist
      order_by: name
    response_variable: lib
  - variables:
      names: '{{ lib[''items''] | map(attribute=''name'') | list }}'
  - variables:
      mixes: '{% set words = [''(from library)'', ''Infinite Mix'', ''Recently added'',
        ''Recently played'', ''All favorited''] %}{% set ns = namespace(o=[]) %}{%
        for n in names %}{% if words | select(''in'', n) | list | count > 0 %}{% set
        ns.o = ns.o + [n] %}{% endif %}{% endfor %}{{ ns.o }}'
  - variables:
      playlists: '{{ names | reject(''in'', mixes) | list }}'
  - action: openhasp.command
    data:
      keyword: p6b99.options
      parameters: '{{ ([''Choose a playlist...''] + playlists) | join(''%c'' | format(10))
        }}'
    target:
      entity_id: openhasp.openhasp2
  - action: openhasp.command
    data:
      keyword: p6b98.options
      parameters: '{{ ([''Choose a mix...''] + mixes) | join(''%c'' | format(10))
        }}'
    target:
      entity_id: openhasp.openhasp2
  mode: restart
- id: openhasp2_energy_days
  alias: openhasp2 Energy Days
  description: Fills input_text.openhasp2_energy_days with 30 daily home-use totals
    in kWh (oldest first) for the bar chart on the openhasp2 Energy page. Home use
    = grid import + solar - export, from the energymonitor statistics. The *_2 ids
    hold Nov 9-21 2026 (before the 2026-11-21 rename); they can be dropped from the
    list after 2026-12-21.
  triggers:
  - minutes: '5'
    trigger: time_pattern
  - event: start
    trigger: homeassistant
  conditions: []
  actions:
  - action: recorder.get_statistics
    data:
      period: day
      start_time: '{{ (today_at() - timedelta(days=29)).isoformat() }}'
      statistic_ids:
      - sensor.energymonitor_house_kwh
      - sensor.energymonitor_solar_kwh
      - sensor.energymonitor_house_return_to_grid_kwh
      - sensor.energymonitor_house_kwh_2
      - sensor.energymonitor_solar_kwh_2
      - sensor.energymonitor_house_return_to_grid_kwh_2
      types:
      - change
    response_variable: stats
  - action: input_text.set_value
    data:
      value: "{%- set s = stats.statistics -%}\n{%- set imp_ids = ['sensor.energymonitor_house_kwh',
        'sensor.energymonitor_house_kwh_2'] -%}\n{%- set sol_ids = ['sensor.energymonitor_solar_kwh',
        'sensor.energymonitor_solar_kwh_2'] -%}\n{%- set exp_ids = ['sensor.energymonitor_house_return_to_grid_kwh',
        'sensor.energymonitor_house_return_to_grid_kwh_2'] -%}\n{%- set ns = namespace(out=[])
        -%}\n{%- for i in range(30) -%}\n  {%- set day = (today_at() - timedelta(days=29
        - i)).date() | string -%}\n  {%- set t = namespace(imp=0, sol=0, exp=0) -%}\n
        \ {%- for sid in imp_ids -%}{%- for e in s.get(sid, []) if (as_datetime(e.start)
