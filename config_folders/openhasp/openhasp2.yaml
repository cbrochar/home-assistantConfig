        {{ "\uE458" | e }}
        {% elif is_state_attr(states('input_select.openhasp2_speaker'), 'repeat', 'all') %}
        {{ "\uE456" | e }}
        {%-else %}
        {{ "\uE457" | e }}
        {%-endif %}
      "text_opa": "{{ '80' if states(states('input_select.openhasp2_speaker')) in ['unavailable', 'unknown'] else '255' }}"
    event:
