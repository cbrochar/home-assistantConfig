      "text": "{% set p = states('input_select.openhasp2_speaker') %}{{ state_attr(p,'media_artist') or '' }}"

  - obj: "p6b39" # cover art frame (also holds the browse tabs)
    properties:
      "hidden": "{% set p = states('input_select.openhasp2_speaker') %}{{ 0 if is_state('input_boolean.openhasp2_browse','on') or state_attr(p,'entity_picture') else 1 }}"

  - obj: "p6b89" # speaker name button - tap to open/close Playlists & Mixes
    properties:
      "text": "{{ {'media_player.denon_avr_x1700h_4':'Living Room','media_player.living_room_sound_bar_2':'Sound Bar','media_player.bedroom_tv_2':'Bedroom TV','media_player.master_bedroom_tv':'Master TV'}.get(states('input_select.openhasp2_speaker'), 'Speaker') }}"
      "text_font": "24"
    event:
      "up":
        - action: input_boolean.toggle
          target:
            entity_id: input_boolean.openhasp2_browse

  - obj: "p6b93" # speaker picker grid, selected speaker in orange
    properties:
      "text_font": "24"
      "options": >-
        {%- set names = {'media_player.denon_avr_x1700h_4':'Living Room','media_player.living_room_sound_bar_2':'Sound Bar','media_player.bedroom_tv_2':'Bedroom TV','media_player.master_bedroom_tv':'Master TV'} -%}
        {%- set sel = states('input_select.openhasp2_speaker') -%}
        {%- set nl = '%c' | format(10) -%}
        {%- set ns = namespace(out=[]) -%}
        {%- for o in state_attr('input_select.openhasp2_speaker','options') or [] -%}
        {%- if loop.index0 > 0 and loop.index0 % 2 == 0 %}{% set ns.out = ns.out + [nl] %}{% endif -%}
        {%- set n = names.get(o, o) -%}
        {%- set ns.out = ns.out + [('#FFAC00 ' ~ n ~ '#') if o == sel else n] -%}
        {%- endfor -%}
        {{- ns.out | to_json -}}
    event:
      "down":
        - action: input_select.select_option
          target:
            entity_id: input_select.openhasp2_speaker
          data:
            option: "{{ state_attr('input_select.openhasp2_speaker','options')[val | int(0)] }}"

  - obj: "p6b95" # browse tabs
    properties:
      "hidden": "{{ 0 if is_state('input_boolean.openhasp2_browse','on') else 1 }}"
  - obj: "p6b96"
    properties:
      "text": "Playlists"
  - obj: "p6b97"
    properties:
      "text": "Mixes"

  - obj: "p6b99" # Playlists dropdown (options filled by automation openhasp2 media lists)
    event:
      "changed":
        - condition: template
          value_template: "{{ val | int(0) > 0 }}"
        - action: script.turn_on
          target:
            entity_id: script.openhasp2_play_from_library
          data:
            variables:
              name: "{{ text }}"
              media_type: playlist

  - obj: "p6b98" # Mixes dropdown
    event:
      "changed":
        - condition: template
          value_template: "{{ val | int(0) > 0 }}"
        - action: script.turn_on
          target:
            entity_id: script.openhasp2_play_from_library
          data:
            variables:
              name: "{{ text }}"
              media_type: playlist

  - obj: "p6b17" # play/pause/stop
    properties:
      "text": >
        {% if is_state(states('input_select.openhasp2_speaker'), 'playing') %}
        {{ "\uE3E4" | e }}
        {%-else %}
        {{ "\uE40A" | e }}
        {%-endif %}
      "text_opa": "{{ '80' if states(states('input_select.openhasp2_speaker')) in ['unavailable', 'unknown'] else '255' }}"
    event:
      "down":
        - action: media_player.media_play_pause
          target:
            entity_id: "{{ states('input_select.openhasp2_speaker') }}"
      "long":
        - action: media_player.media_stop
          target:
            entity_id: "{{ states('input_select.openhasp2_speaker') }}"

  - obj: "p6b16" # prev
    properties:
      "text_opa": "{{ '80' if states(states('input_select.openhasp2_speaker')) in ['unavailable', 'unknown'] else '255' }}"
    event:
      "down":
        - action: media_player.media_previous_track
