        - action: light.turn_on
          target:
            entity_id: light.colored_lights
          data:
            brightness: "{{ val | int }}"

  # ===========================================================================
  #  PAGE 6 - Media (Music Assistant)
  #  Every control acts on whichever speaker input_select.openhasp2_speaker
  #  holds. The speaker grid shows that helper's options in the same order.
  #  Buttons dim when the selected speaker is unavailable.
  #
  #  To add a speaker: add it to input_select.openhasp2_speaker, and add its
  #  short name to the two name maps below (p6b89 and p6b93).
  # ===========================================================================

  # --- Now playing -----------------------------------------------------------
  - obj: "p6b14" # title label
    properties:
      "text": "{% set p = states('input_select.openhasp2_speaker') %}{{ state_attr(p,'media_title') or '-' }}"

  - obj: "p6b15" # artist label
    properties:
      "text": "{% set p = states('input_select.openhasp2_speaker') %}{{ state_attr(p,'media_artist') or '' }}"

  - obj: "p6b39" # cover art frame (also holds the browse tabs); hidden when
                 #   there's no art and the browse panel is closed
    properties:
      "hidden": "{% set p = states('input_select.openhasp2_speaker') %}{{ 0 if is_state('input_boolean.openhasp2_browse','on') or state_attr(p,'entity_picture') else 1 }}"

  # --- Speaker picker --------------------------------------------------------
  - obj: "p6b89" # speaker name button - tap to open/close Playlists & Mixes
    properties:
      "text": "{{ {'media_player.denon_avr_x1700h_4':'Living Room','media_player.living_room_sound_bar_2':'Sound Bar','media_player.bedroom_tv_2':'Bedroom TV','media_player.master_bedroom_tv':'Master TV'}.get(states('input_select.openhasp2_speaker'), 'Speaker') }}"
      "text_font": "24"
    event:
      "up":
        - action: input_boolean.toggle
          target:
            entity_id: input_boolean.openhasp2_browse

  - obj: "p6b93" # speaker picker grid (2 per row), selected speaker in orange
    properties:
      "text_font": "24"
      "options": >-
        {%- set names = {'media_player.denon_avr_x1700h_4':'Living Room','media_player.living_room_sound_bar_2':'Sound Bar','media_player.bedroom_tv_2':'Bedroom TV','media_player.master_bedroom_tv':'Master TV'} -%}
        {%- set sel = states('input_select.openhasp2_speaker') -%}
        {%- set nl = '%c' | format(10) -%}
        {%- set ns = namespace(out=[]) -%}
        {%- for o in state_attr('input_select.openhasp2_speaker','options') or [] -%}
        {%- if loop.index0 > 0 and loop.index0 % 2 == 0 %}{% set ns.out = ns.out + [nl] %}{% endif -%}
        {%- set n = names.get(o, o) -%}
        {%- set ns.out = ns.out + [('#FFAC00 ' ~ n ~ '#') if o == sel else n] -%}
        {%- endfor -%}
        {{- ns.out | to_json -}}
    event:
      "down":
        - action: input_select.select_option
          target:
            entity_id: input_select.openhasp2_speaker
          data:
            option: "{{ state_attr('input_select.openhasp2_speaker','options')[val | int(0)] }}"

  # --- Browse panel (Playlists & Mixes) --------------------------------------
  # Shown while input_boolean.openhasp2_browse is on. Picking an item runs
  # script.openhasp2_play_from_library, which plays it and closes the panel.
  # Dropdown options are filled by automation "openhasp2 media lists".
  # Item 0 in each dropdown is a header, so it is ignored.
  - obj: "p6b95" # browse tabs container
    properties:
      "hidden": "{{ 0 if is_state('input_boolean.openhasp2_browse','on') else 1 }}"
  - obj: "p6b96" # tab 1 title
    properties:
      "text": "Playlists"
  - obj: "p6b97" # tab 2 title
    properties:
      "text": "Mixes"

  - obj: "p6b99" # Playlists dropdown
    event:
      "changed":
        - condition: template
          value_template: "{{ val | int(0) > 0 }}"
        - action: script.turn_on
          target:
            entity_id: script.openhasp2_play_from_library
          data:
            variables:
              name: "{{ text }}"
              media_type: playlist

  - obj: "p6b98" # Mixes dropdown
    event:
      "changed":
        - condition: template
          value_template: "{{ val | int(0) > 0 }}"
        - action: script.turn_on
          target:
            entity_id: script.openhasp2_play_from_library
          data:
            variables:
              name: "{{ text }}"
              media_type: playlist

  # --- Transport controls ----------------------------------------------------
  - obj: "p6b17" # play/pause (tap) and stop (hold)
    properties:
      "text": >
        {% if is_state(states('input_select.openhasp2_speaker'), 'playing') %}
        {{ "\uE3E4" | e }}
        {%-else %}
        {{ "\uE40A" | e }}
        {%-endif %}
      "text_opa": "{{ '80' if states(states('input_select.openhasp2_speaker')) in ['unavailable', 'unknown'] else '255' }}"
    event:
      "down":
        - action: media_player.media_play_pause
          target:
            entity_id: "{{ states('input_select.openhasp2_speaker') }}"
      "long":
        - action: media_player.media_stop
          target:
            entity_id: "{{ states('input_select.openhasp2_speaker') }}"

  - obj: "p6b16" # prev
    properties:
      "text_opa": "{{ '80' if states(states('input_select.openhasp2_speaker')) in ['unavailable', 'unknown'] else '255' }}"
    event:
      "down":
        - action: media_player.media_previous_track
          target:
            entity_id: "{{ states('input_select.openhasp2_speaker') }}"
  - obj: "p6b18" # next
    properties:
      "text_opa": "{{ '80' if states(states('input_select.openhasp2_speaker')) in ['unavailable', 'unknown'] else '255' }}"
    event:
      "down":
        - action: media_player.media_next_track
          target:
            entity_id: "{{ states('input_select.openhasp2_speaker') }}"

  - obj: "p6b20" # volume slider
    properties:
      "val": "{% set p = states('input_select.openhasp2_speaker') %}{{ ((state_attr(p,'volume_level') or 0) * 100) | int }}"
      "click": "{{ 'false' if states(states('input_select.openhasp2_speaker')) in ['unavailable', 'unknown'] else 'true' }}"
    event:
      "up":
        - action: media_player.volume_set
          target:
            entity_id: "{{ states('input_select.openhasp2_speaker') }}"
          data:
            volume_level: "{{ val | int / 100 }}"

  - obj: "p6b27" # repeat: each tap cycles off -> all -> one -> off
    properties:
      "text": >
        {% if is_state_attr(states('input_select.openhasp2_speaker'), 'repeat', 'one') %}
        {{ "\uE458" | e }}
        {% elif is_state_attr(states('input_select.openhasp2_speaker'), 'repeat', 'all') %}
        {{ "\uE456" | e }}
        {%-else %}
        {{ "\uE457" | e }}
        {%-endif %}
      "text_opa": "{{ '80' if states(states('input_select.openhasp2_speaker')) in ['unavailable', 'unknown'] else '255' }}"
    event:
      "down":
        - action: media_player.repeat_set
          target:
            entity_id: "{{ states('input_select.openhasp2_speaker') }}"
          data:
            repeat: "{{ {'off':'all','all':'one','one':'off'}.get(state_attr(states('input_select.openhasp2_speaker'), 'repeat'), 'all') }}"

  - obj: "p6b25" # shuffle
    properties:
      "text": >
        {% if state_attr(states('input_select.openhasp2_speaker'), 'shuffle') %}
        {{ "\uE49D" | e }}
        {%-else %}
        {{ "\uE49E" | e }}
        {%-endif %}
      "text_opa": "{{ '80' if states(states('input_select.openhasp2_speaker')) in ['unavailable', 'unknown'] else '255' }}"
    event:
      "down":
        - action: media_player.shuffle_set
          target:
            entity_id: "{{ states('input_select.openhasp2_speaker') }}"
          data:
            shuffle: "{{ not state_attr(states('input_select.openhasp2_speaker'), 'shuffle') }}"

  - obj: "p6b24" # mute
    properties:
      "text": >
        {% if state_attr(states('input_select.openhasp2_speaker'), 'is_volume_muted') %}
        {{ "\uE75F" | e }}
        {%-else %}
        {{ "\uE57E" | e }}
        {%-endif %}
      "text_opa": "{{ '80' if states(states('input_select.openhasp2_speaker')) in ['unavailable', 'unknown'] else '255' }}"
    event:
      "down":
        - action: media_player.volume_mute
          target:
            entity_id: "{{ states('input_select.openhasp2_speaker') }}"
          data:
            is_volume_muted: "{{ not state_attr(states('input_select.openhasp2_speaker'), 'is_volume_muted') }}"
