        {%- endif %}

  # ===========================================================================
  #  PAGE 2 - Energy (ESPHome energymonitor)
  #  sensor.energymonitor_total_solar_watts = solar production
  #  sensor.energymonitor_total_house_watts = grid (+ buying, - selling back)
  #  home use = solar + grid
  #  Values under 1000 W show as "W", above as "kW".
  # ===========================================================================

  # --- Live readings ---------------------------------------------------------
  - obj: "p2b12" # solar
    properties:
      "text": >-
        {%- set v = [states('sensor.energymonitor_total_solar_watts')|float(0), 0]|max -%}
        {{ (v/1000)|round(1) ~ ' kW' if v >= 1000 else (v|int) ~ ' W' }}

  - obj: "p2b22" # grid
    properties:
      "text": >-
        {%- set v = states('sensor.energymonitor_total_house_watts')|float(0)|abs -%}
        {{ (v/1000)|round(1) ~ ' kW' if v >= 1000 else (v|int) ~ ' W' }}
      "text_color": "{{ '#1E88E5' if states('sensor.energymonitor_total_house_watts')|float(0) >= 0 else '#8E5CD9' }}"  # blue = buying, purple = selling
  - obj: "p2b23" # grid caption
    properties:
      "text": "{{ 'Grid in' if states('sensor.energymonitor_total_house_watts')|float(0) >= 0 else 'Grid out' }}"

  - obj: "p2b32" # home
    properties:
      "text": >-
        {%- set s = [states('sensor.energymonitor_total_solar_watts')|float(0), 0]|max -%}
        {%- set v = [s + states('sensor.energymonitor_total_house_watts')|float(0), 0]|max -%}
        {{ (v/1000)|round(1) ~ ' kW' if v >= 1000 else (v|int) ~ ' W' }}

  # --- Flow arrows -----------------------------------------------------------
  # Each flow has a label (blank under 10 W) and a line (p2b40-42) that is
  # bright when power flows that way and faded when it doesn't.
  - obj: "p2b45" # solar -> grid flow
    properties:
      "text": >-
        {%- set s = [states('sensor.energymonitor_total_solar_watts')|float(0), 0]|max -%}
        {%- set v = [[0 - states('sensor.energymonitor_total_house_watts')|float(0), 0]|max, s]|min -%}
        {{ '' if v < 10 else ((v/1000)|round(1) ~ ' kW' if v >= 1000 else (v|int) ~ ' W') }}
  - obj: "p2b40" # solar -> grid line
    properties:
      "line_opa": "{{ 255 if 0 - states('sensor.energymonitor_total_house_watts')|float(0) >= 10 else 50 }}"

  - obj: "p2b46" # solar -> home flow
    properties:
      "text": >-
        {%- set s = [states('sensor.energymonitor_total_solar_watts')|float(0), 0]|max -%}
        {%- set e = [[0 - states('sensor.energymonitor_total_house_watts')|float(0), 0]|max, s]|min -%}
        {%- set v = s - e -%}
        {{ '' if v < 10 else ((v/1000)|round(1) ~ ' kW' if v >= 1000 else (v|int) ~ ' W') }}
  - obj: "p2b41" # solar -> home line
    properties:
      "line_opa": >-
        {%- set s = [states('sensor.energymonitor_total_solar_watts')|float(0), 0]|max -%}
        {%- set e = [[0 - states('sensor.energymonitor_total_house_watts')|float(0), 0]|max, s]|min -%}
        {{ 255 if s - e >= 10 else 50 }}

  - obj: "p2b47" # grid -> home flow
    properties:
      "text": >-
        {%- set v = [states('sensor.energymonitor_total_house_watts')|float(0), 0]|max -%}
        {{ '' if v < 10 else ((v/1000)|round(1) ~ ' kW' if v >= 1000 else (v|int) ~ ' W') }}
  - obj: "p2b42" # grid -> home line
    properties:
      "line_opa": "{{ 255 if states('sensor.energymonitor_total_house_watts')|float(0) >= 10 else 50 }}"

  # --- Gauges ----------------------------------------------------------------
  - obj: "p2b51" # returned to grid gauge (0-8 kW)
    properties:
      "val": "{{ [[0 - states('sensor.energymonitor_total_house_watts')|float(0), 0]|max, 8000]|min|int }}"
  - obj: "p2b52" # returned to grid label
    properties:
      "text": >-
        {%- set v = [0 - states('sensor.energymonitor_total_house_watts')|float(0), 0]|max -%}
        {{ (v/1000)|round(2) ~ ' kW' if v >= 1000 else (v|int) ~ ' W' }}

  - obj: "p2b61" # self-consumed solar gauge: % of solar used in the house
    properties:
      "val": >-
        {%- set s = [states('sensor.energymonitor_total_solar_watts')|float(0), 0]|max -%}
        {%- set e = [[0 - states('sensor.energymonitor_total_house_watts')|float(0), 0]|max, s]|min -%}
        {{ ((s - e) / s * 100)|int if s >= 10 else 0 }}
  - obj: "p2b62" # self-consumed solar label
    properties:
      "text": >-
        {%- set s = [states('sensor.energymonitor_total_solar_watts')|float(0), 0]|max -%}
        {%- set e = [[0 - states('sensor.energymonitor_total_house_watts')|float(0), 0]|max, s]|min -%}
        {{ (((s - e) / s * 100)|round(1) ~ ' %') if s >= 10 else 'No solar' }}

  # --- 30-day home use bar chart ---------------------------------------------
  # p2b100 = oldest day ... p2b129 = today. Data: input_text.openhasp2_energy_days,
  # filled hourly by automation "openhasp2 Energy Days".
