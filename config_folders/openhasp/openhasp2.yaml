# =============================================================================
#  openHASP PLATE 2  (openhasp.openhasp2, Living Room, 800x480)
# =============================================================================
#
#  What this file does:
#    Links objects on the plate's screen to Home Assistant. Each entry is one
#    on-screen object, named  p<page>b<id>  (p4b16 = page 4, object 16).
#      properties:  values HA pushes TO the plate whenever an entity changes
#      event:       what HA does when you touch the object ("down" = press,
#                   "up" = release, "changed" = value changed, "long" = hold)
#
#  Where the screen layout lives:
#    openhasp2pages.jsonl (positions, sizes, fonts, colors, nav buttons). It is
#    uploaded to the plate itself; object ids here must match it.
#
#  Pages:
#    0  Banner     on every page: page title, clock, date, Wi-Fi, temperature
#    1  Weather    now + hourly (every 4 h) + 4-day forecast
#    2  Energy     live solar/grid/home flow + 30-day usage bars
#    3  Alarm      status + keypad
#    4  Lights     tiles for 9 lights (tap = on/off, slider = brightness)
#    5  RGB        Piano Room bulbs + all RGB lights (color wheel, brightness)
#    6  Media      Music Assistant player for the speaker picked on screen
#
#  Helpers and automations this plate relies on:
#    input_select.openhasp2_speaker   which speaker page 6 controls
#    input_boolean.openhasp2_browse   shows/hides the Playlists & Mixes panel
#    input_text.openhasp2_energy_days 30 days of usage for the page 2 bars
#    automation "openhasp2 Energy Days"   fills input_text above every hour
#    automation "openhasp2 media lists"   fills the Playlists/Mixes dropdowns
#    automation "openhasp2-detect-mediaplayer-coverart"  cover art on page 6
#    script.openhasp2_play_from_library   plays a picked playlist
#    script.code_button                   alarm keypad logic
#
#  Icons: text like "" is a Material Design Icons glyph in the plate's
#  icon font.
#
#  After editing: reload the openHASP integration
#  (Settings -> Devices & Services -> openHASP -> ... -> Reload).
# =============================================================================

objects:

  # ===========================================================================
  #  PAGE 0 - Top banner (visible on every page)
  # ===========================================================================
  - obj: "p0b4" # page title roller: spins to the current page's name
    properties:
      "val": "{{states('openhasp.openhasp2') | int(0) -1}}"

  # p0b10 (banner date) is driven by the plate's own clock ("template" in the
  # pages file); time zone is set to Eastern on the plate. Only its position is set here.
  - obj: "p0b10"
    properties:
      "x": "190"

  - obj: "p0b5" # outdoor temperature (top right)
    properties:
      "text": "{{ state_attr('weather.ecobee','temperature') |string + '°F'}}"

  - obj: "p0b6" # clock (top left)
    properties:
      "text": "{{ now().strftime('%-I:%M %p') }}"

  - obj: "p0b7" # Wi-Fi icon, colored by signal strength:
                #   green > -50 dBm, olive, orange, maroon, red = weakest
    properties:
      "text_color": "{% if -50 <= state_attr('openhasp.openhasp2','rssi') | int(0) %}green{% elif -51 > state_attr('openhasp.openhasp2','rssi') | int(0) >= -60 %}olive{% elif -61 > state_attr('openhasp.openhasp2','rssi') | int(0) >= -70 %}orange{% elif -71 > state_attr('openhasp.openhasp2','rssi') |int (0) >= -80 %}maroon{% else %}red{% endif %}"

  - obj: "p0b9" # thermometer icon, colored by outdoor temp:
                #   yellow <= 30°F, blue 31-40, green 41-90, red above 90
    properties:
      "text_color":
        "{% if state_attr('weather.ecobee','temperature') |int(0) <= 30  %}yellow
        {% elif 30 < state_attr('weather.ecobee','temperature') |int(0) <= 40  %}blue
        {% elif 40 < state_attr('weather.ecobee','temperature') |int(0) <= 90 %}green
        {% else %}red{% endif %}"

  # ===========================================================================
  #  PAGE 1 - Weather
  #  Condition text/icon come from sensor.weather_hourly (the Ecobee reports
  #  "sunny" at night). Temperature still comes from the Ecobee.
  #  Forecast slots show "-" until the forecast list is long enough.
  #  Icons are image files on the plate: z-128-<condition>.png
  # ===========================================================================

  # --- Current conditions ----------------------------------------------------
  - obj: "p1b15" # today's date, e.g. "Saturday 11/22"
    properties:
      "text": "{{ now().strftime('%A %m/%d') }}"

  - obj: "p1b16" # current temperature (°F)
    properties:
      "text": "{{ state_attr('weather.ecobee','temperature') |string + '°F' if not is_state('weather.ecobee','unavailable') }}"

  - obj: "p1b17" # Current weather condition
    properties:
      "text": >-
        {%- set c = states('sensor.weather_hourly') -%}
        {%- set names = {'clear-night':'Clear night','cloudy':'Cloudy','fog':'Fog','hail':'Hail','lightning':'Lightning','lightning-rainy':'Thunderstorms','partlycloudy':'Partly cloudy','pouring':'Pouring rain','rainy':'Rainy','snowy':'Snowy','snowy-rainy':'Snowy-rainy','sunny':'Sunny','windy':'Windy','windy-variant':'Windy','exceptional':'Exceptional','unavailable':'(not available)','unknown':'(not available)'} -%}
        {{- names.get(c, c) -}}

  - obj: "p1b18" # Current condition image
    properties:
      "src": "{{ 'L:/z-128-' ~ states('sensor.weather_hourly') ~ '.png' if has_value('sensor.weather_hourly') else 'L:/openhasp_dummy_img.png' }}"

  # --- Hourly forecast (+4h ... +24h) ---------------------------------------
  # Three objects per slot: time label, temperature, condition icon.
  # The number in [ ] is the hour offset into the forecast list.

  - obj: "p1b21" # Forecast time +4h
    properties:
      "text": >
        {%- if (state_attr('sensor.weather_hourly','forecast') or []) | count > 23 %}
        {%- set update = states('sensor.date') %}
        {%- set midnight = now().replace(hour=0, minute=0, second=0, microsecond=0).timestamp() %}
        {%- set event = as_timestamp(strptime(state_attr('sensor.weather_hourly','forecast')[4]['datetime'], '%Y-%m-%dT%H:%M:%S%z', default='2020-01-00T00:00:00+00:00')) %}
        {%- set delta = ((event - midnight) // 86400) | int %}
        {%- if delta == 0 %}
        Today
        {%- elif delta == 1 %}
        Tomorrow
        {%- endif %}
        {{- event | timestamp_custom(" %-I %p") }}
        {%- endif %}

  - obj: "p1b22" # Forecast temp +4h
    properties:
      "text": "{{ state_attr('sensor.weather_hourly','forecast')[4]['temperature'] if (state_attr('sensor.weather_hourly','forecast') or []) | count > 23 else '-' }}"

  - obj: "p1b23" # Forecast condition +4h
    properties:
      "src": >
        {%- if (state_attr('sensor.weather_hourly','forecast') or []) | count > 23 %}
        L:/z-128-{{ state_attr('sensor.weather_hourly','forecast')[4]['condition'] }}.png
        {%- endif %}

  - obj: "p1b25" # Forecast time +8h
