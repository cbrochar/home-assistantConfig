  - obj: "p1b63" # Forecast condition +24h
    properties:
      "src": >
        {%- if (state_attr('sensor.weather_hourly','forecast') or []) | count > 23 %}
        L:/z-128-{{ state_attr('sensor.weather_hourly','forecast')[23]['condition'] }}.png
        {%- endif %}

  # --- Daily forecast (+1 to +4 days) ---------------------------------------
  # Four objects per day: day name, low, high, condition icon.
  - obj: "p1b65" # Forecast date +1
    properties:
      "text": >
        {%- if (state_attr('sensor.weather_daily','forecast') or []) | count > 4 %}
        {%- set now1 = as_timestamp(strptime(state_attr('sensor.weather_daily','forecast')[1]['datetime'], '%Y-%m-%dT%H:%M:%S%z', default='2020-01-01T00:00:00+00:00')) %}
        {%- set day = now1 | timestamp_custom("%w") %}
        {%- set days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"] %}
        {{ days[ day | int -1 ] }}{{ now1 | timestamp_custom(" %d") }}
        {%- endif %}

  - obj: "p1b66" # Forecast temp min +1d
    properties:
      "text": "{{ state_attr('sensor.weather_daily','forecast')[1]['templow'] if (state_attr('sensor.weather_daily','forecast') or []) | count > 4 else '-' }}"

  - obj: "p1b67" # Forecast temp max +1d
    properties:
      "text": "{{ state_attr('sensor.weather_daily','forecast')[1]['temperature'] if (state_attr('sensor.weather_daily','forecast') or []) | count > 4 else '-' }}"

  - obj: "p1b68" # Forecast condition +1d
    properties:
      "src": >
        {%- if (state_attr('sensor.weather_daily','forecast') or []) | count > 4 %}
        L:/z-128-{{ state_attr('sensor.weather_daily','forecast')[1]['condition'] }}.png
        {%- endif %}

  - obj: "p1b71" # Forecast date +2d
    properties:
      "text": >
        {%- if (state_attr('sensor.weather_daily','forecast') or []) | count > 4 %}
        {%- set now1 = as_timestamp(strptime(state_attr('sensor.weather_daily','forecast')[2]['datetime'], '%Y-%m-%dT%H:%M:%S%z', default='2020-01-01T00:00:00+00:00')) %}
