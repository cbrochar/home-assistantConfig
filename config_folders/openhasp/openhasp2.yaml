  # ===========================================================================
  #  PAGE 3 - Alarm panel (alarm_control_panel.alarm)
  # ===========================================================================
  - obj: "p3b14" # status text: Armed Home / Away / Vacation / Night / Disarmed
    properties:
      "text": >
        {% if states("alarm_control_panel.alarm") == "armed_home" %}
        Armed Home
        {% elif states("alarm_control_panel.alarm")== "armed_away"  %}
        Armed Away
        {% elif states("alarm_control_panel.alarm")== "armed_vacation"  %}
        Armed Vacation
        {% elif states("alarm_control_panel.alarm")== "armed_night" %}
        Armed Night
        {% else %}
        Disarmed
        {% endif %}
  - obj: "p3b13" # shield icon: green when disarmed, red when armed
    properties:
      "text": '{{"\uE68A" if is_state("alarm_control_panel.alarm", "disarmed") else "\uE565" | e }}'
      "text_color": '{{"#00ff7b " if is_state("alarm_control_panel.alarm", "disarmed") else "#FF0000" | e }}'
  - obj: "p3b1" # keypad: every key press goes to script.code_button,
                #   which collects the digits and arms/disarms (see scripts.yaml)
    event:
      "down":
        sequence:
          action: script.turn_on
          target:
            entity_id: script.code_button
          data:
            variables:
              value: "{{ val }}"
              text: "{{ text }}"
              haspname: "{{state_attr('openhasp.openhasp2','friendly_name')}}"
              haspMAC: "{{state_attr('openhasp.openhasp2','mac')}}"

  # ===========================================================================
  #  PAGE 4 - Light tiles
  #  Every tile uses the same numbering, where N is the tile number (1-9):
  #    p4bN1 tile button   p4bN2 icon background   p4bN3 icon
  #    p4bN4 name label    p4bN5 On/Off label      p4bN6 brightness slider (0-100 %)
  #  Tapping the tile or the icon toggles the light. On/off-only lights hide
  #  their slider.
  # ===========================================================================

  # --- Tile 1: TV Downlights -------------------------------------------------
  - obj: "p4b14" # name label (layout file still says "My Lamp")
    properties:
      "text": "TV Downlights"
  - obj: "p4b11" # button
    event:
      "down":
        - action: light.toggle
          target:
            entity_id: light.tvdownlights
  - obj: "p4b15" # on/off label
    properties:
      "text": '{{ "On" if is_state("light.tvdownlights", "on") else "Off" }}'
  - obj: "p4b13" # icon
    properties:
      "text_color": '{{ "#e88c03" if is_state("light.tvdownlights", "on") else "#6F6F6F" }}'
    event:
      "down":
        - action: light.toggle
          target:
            entity_id: light.tvdownlights
  - obj: "p4b12" # icon background
    properties:
      "bg_color": '{{ "#493416" if is_state("light.tvdownlights", "on") else "#2C2C2C" }}'
  - obj: "p4b16" # slider (0-100 %)
    properties:
      "val": "{{ ((state_attr('light.tvdownlights', 'brightness') or 0) / 2.55) | round(0) | int }}"
    event:
      "up":
        - action: light.turn_on
          target:
            entity_id: light.tvdownlights
          data:
            brightness_pct: "{{ val | int }}"

