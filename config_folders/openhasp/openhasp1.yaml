  # ===========================================================================
  #  PAGE 8 - Alarm panel (alarm_control_panel.alarm)
  # ===========================================================================
  - obj: "p8b14" # status text: Armed Home / Away / Vacation / Night / Disarmed
    properties:
      "text": >
                {% if states("alarm_control_panel.alarm") == "armed_home" %}
                Armed Home
                {% elif states("alarm_control_panel.alarm")== "armed_away"  %}
                Armed Away
                {% elif states("alarm_control_panel.alarm")== "armed_vacation"  %}
                Armed Vacation
                {% elif states("alarm_control_panel.alarm")== "armed_night" %}
                Armed Night
                {% else %}
                Disarmed
                {% endif %}
  - obj: "p8b13" # shield icon: green when disarmed, red when armed
    properties:
      "text": '{{"\uE68A" if is_state("alarm_control_panel.alarm", "disarmed") else "\uE565" | e }}'
      "text_color": '{{"#00ff7b " if is_state("alarm_control_panel.alarm", "disarmed") else "#FF0000" | e }}'
  - obj: "p8b1" # keypad: every key press goes to script.code_button,
                #   which collects the digits and arms/disarms (see scripts.yaml)
    event:
      "down":
        sequence:
          action: script.turn_on
          target:
            entity_id: script.code_button
          data:
            variables:
              value: "{{ val }}"
              text: "{{ text }}"
              haspname: "{{state_attr('openhasp.openhasp1','friendly_name')}}"
              haspMAC: "{{state_attr('openhasp.openhasp1','mac')}}"
