# =============================================================================
#  openHASP PLATE 1  (openhasp.openhasp1, small 240 px plate with the
#                     Piano Room relay built in)
# =============================================================================
#
#  What this file does:
#    Links objects on the plate's screen to Home Assistant. Each entry is one
#    on-screen object, named  p<page>b<id>  (p2b105 = page 2, object 105).
#      properties:  values HA pushes TO the plate whenever an entity changes
#      event:       what HA does when you touch the object ("down" = press,
#                   "up" = release, "changed" = value changed, "long" = hold)
#
#  Where the screen layout lives:
#    openhasp1pages.jsonl (positions, sizes, fonts, colors). It is uploaded to
#    the plate itself; edit it there and the object ids here must still match.
#
#  Pages:
#    1  Relay buttons    built-in relay (light.piano_room_lights), no HA bindings here
#    2  Kitchen/Dining   on/off + brightness for three lights
#    3  Piano Room       on/off, brightness, color wheel
#    4  Foyer Overhead   on/off, brightness, color wheel
#    5  Backlight        handled by the plate, nothing here
#    6  Moodlight        handled by the plate, nothing here
#    7  Weather          now + hourly + 4-day forecast
#    8  Alarm            status + keypad
#    0  Navigation       shown on every page, handled by the plate
#
#  Icons: text like "\uE6E8" is a Material Design Icons glyph in the plate's
#  icon font (\uE6E8 = lightbulb on, \uE335 = lightbulb off).
#
#  After editing: reload the openHASP integration
#  (Settings -> Devices & Services -> openHASP -> ... -> Reload).
# =============================================================================

objects:

  # ===========================================================================
  #  PAGE 2 - Kitchen & Dining lights
  #  Each light has an on/off switch and a brightness slider (0-255).
  # ===========================================================================

  # --- Kitchen Pendant -------------------------------------------------------
  - obj: "p2b103" # on/off switch (also swaps the bulb icon)
    properties:
      "val": '{{ 1 if is_state("light.kitchen_pendant", "on") else 0 }}'
      "text": '{{ "\uE6E8" if is_state("light.kitchen_pendant", "on") else "\uE335" | e }}'
    event:
      "down":
        - service: homeassistant.toggle
          entity_id: "light.kitchen_pendant"
  - obj: "p2b105" # brightness slider: updates while dragging and on release
    properties:
      "val": "{{ state_attr('light.kitchen_pendant', 'brightness') if state_attr('light.kitchen_pendant', 'brightness') != None else 0 }}"
    event:
      "changed":
        - service: light.turn_on
          data:
            entity_id: light.kitchen_pendant
            brightness: "{{ val }}"
      "up":
        - service: light.turn_on
          data:
            entity_id: light.kitchen_pendant
            brightness: "{{ val }}"

  # --- Kitchen Recessed ------------------------------------------------------
  - obj: "p2b106" # on/off switch
    properties:
      "val": '{{ 1 if is_state("light.kitchen_recessed", "on") else 0 }}'
