#Page 3 - Piano Room: toggle, slider and color all control the Zigbee bulbs (light.piano_room)
  - obj: "p3b103" # switch reverse, checkbox or btn with toggle true
    properties:
      "val": '{{ 1 if is_state("light.piano_room", "on") else 0 }}' 
      "text": '{{ "\uE6E8" if is_state("light.piano_room", "on") else "\uE335" | e }}'
    event:
      "up":
        - service: "light.turn_{{ 'on' if val | int(0) == 1 else 'off' }}"
          target:
            entity_id: "light.piano_room"
  - obj: "p3b106" # Light brightness
    properties:
      "val": "{{ state_attr('light.piano_room', 'brightness') if state_attr('light.piano_room', 'brightness') != None else 0 }}"
    event:
      "changed":
        - service: light.turn_on
          data:
            entity_id: light.piano_room
            brightness: "{{ val }}"
      "up":
        - service: light.turn_on
          data:
            entity_id: light.piano_room
            brightness: "{{ val }}"
  - obj: "p3b107" # ColorPicker
    properties:
      "color": >
        {% if is_state('light.piano_room','on') %}
        {% set rgb = state_attr('light.piano_room','rgb_color') %}
        {{ "#%02x%02x%02x" | format(rgb[0],rgb[1],rgb[2]) }}
        {% endif %}
    event:
      "up":
        - service: light.turn_on
          data:
            entity_id: light.piano_room
            rgb_color: "[{{ r }},{{ g }},{{ b }}]"
