  # ===========================================================================
  #  PAGE 7 - Weather
  #  Current conditions come from the Ecobee (weather.ecobee).
  #  Forecasts come from sensor.weather_hourly / sensor.weather_daily, which
  #  hold a "forecast" list attribute. Each forecast slot shows "-" until the
  #  list has enough entries.
  # ===========================================================================

  # --- Current conditions ----------------------------------------------------
  - obj: "p7b14" # weather icon (image file on the plate: w-32-<condition>.png)
    properties:
      "src": "{{ 'L:/w-32-' + states('weather.ecobee') + '.png' if not is_state('weather.ecobee','unavailable') }}"

  - obj: "p7b15" # today's date, e.g. "Monday 11/24"
    properties:
      "text": "{{ now().strftime('%A %m/%d') }}"

  - obj: "p7b16" # current temperature (°F)
    properties:
      "text": "{{ state_attr('weather.ecobee','temperature') |string + '°F' if not is_state('weather.ecobee','unavailable') }}"

  - obj: "p7b17" # current condition in words ("Partly cloudy", ...)
    properties:
      "text": >
          {% if is_state('weather.ecobee','clear-night') -%}
          Clear night
          {% elif is_state('weather.ecobee','cloudy') -%}
          Cloudy
          {% elif is_state('weather.ecobee','fog') -%}
          Fog
          {% elif is_state('weather.ecobee','hail') -%}
          Hail
          {% elif is_state('weather.ecobee','lightning') -%}
          Lightning
          {% elif is_state('weather.ecobee','lightning-rainy') -%}
          Thunderstorms
          {% elif is_state('weather.ecobee','partlycloudy') -%}
          Partly cloudy
          {% elif is_state('weather.ecobee','pouring') -%}
          Pouring rain
          {% elif is_state('weather.ecobee','rainy') -%}
          Rainy
          {% elif is_state('weather.ecobee','snowy') -%}
          Snowy
          {% elif is_state('weather.ecobee','snowy-rainy') -%}
          Snowy-rainy
          {% elif is_state('weather.ecobee','sunny') -%}
          Sunny
          {% elif is_state('weather.ecobee','windy') -%}
          Windy
          {% elif is_state('weather.ecobee','windy-variant') -%}
          Windy
          {% elif is_state('weather.ecobee','exceptional') -%}
          Exceptional
          {% elif is_state('weather.ecobee','unavailable') -%}
          (not available)
          {% else -%}
          {{ states('weather.ecobee') }}
          {% endif -%}

  # --- Tab dots --------------------------------------------------------------
  # p7b10 is the swipeable tab view (hourly / daily). When you swipe, this
  # redraws the two dots in p7b19 so the dark dot marks the current tab.
  # If you add a tab in the pages file, add a matching branch here.
  - obj: "p7b10"
    event:
      "changed":
        - service: openhasp.command
          target:
            entity_id: openhasp.openhasp1
          data:
            keyword: p7b19.text
            parameters: >
              {% if val == 0 %}
              {{ "#000000 \u2022# #909090 \u2022#" | e }}
              {%-elif val == 1 %}
              {{ "#909090 \u2022# #000000 \u2022#" | e }}
              {% endif %}

  # --- Hourly forecast (+2h, +4h, +6h, +8h) ---------------------------------
  # Three objects per slot: time label, temperature, condition icon.
  # The number in [ ] is the hour offset into the forecast list.
  - obj: "p7b21" # +2h time, e.g. "Today 3 PM"
    properties:
      "text": >
        {%- if (state_attr('sensor.weather_hourly','forecast') or []) | count > 8 %}
        {%- set update = states('sensor.date') %}
        {%- set midnight = now().replace(hour=0, minute=0, second=0, microsecond=0).timestamp() %}
        {%- set event = as_timestamp(strptime(state_attr('sensor.weather_hourly','forecast')[2]['datetime'], '%Y-%m-%dT%H:%M:%S%z', default='2020-01-00T00:00:00+00:00')) %}
        {%- set delta = ((event - midnight) // 86400) | int %}
        {%- if delta == 0 %}
        Today
        {%- elif delta == 1 %}
        Tomorrow
        {%- endif %}
        {{- event | timestamp_custom(" %-I %p") }}
        {%- endif %}

  - obj: "p7b22" # +2h temperature
    properties:
      "text": "{{ state_attr('sensor.weather_hourly','forecast')[2]['temperature'] if (state_attr('sensor.weather_hourly','forecast') or []) | count > 8 else '-' }}"

  - obj: "p7b23" # +2h condition icon
    properties:
      "src": >
        {%- if (state_attr('sensor.weather_hourly','forecast') or []) | count > 8 %}
        L:/w-32-{{ state_attr('sensor.weather_hourly','forecast')[2]['condition'] }}.png
        {%- endif %}

