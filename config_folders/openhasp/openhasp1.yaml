#page 7
  - obj: "p7b14" # Icon  
    properties:
      "src": "{{ 'L:/w-32-' + states('weather.ecobee') + '.png' if not is_state('weather.ecobee','unavailable') }}"

  - obj: "p7b15" # Current date (adjust format to your needs)
    properties:
      "text": >
        {%- if states.weather.ecobee is not none and not is_state('weather.ecobee','unavailable') %}
        {%- set day = (states.weather.ecobee.last_changed).strftime('%w') %}
        {%- set days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"] %}
        {{- days[ day | int -1 ] }} {{ (states.weather.ecobee.last_changed).strftime('%m/%d') }}
        {% endif -%}

  - obj: "p7b16" # Current temp (you can use your own outdoor temp sensor if you have one)
    properties:
      "text": "{{ state_attr('weather.ecobee','temperature') |string + '°F' if not is_state('weather.ecobee','unavailable') }}"  # or "{{ states('sensor.your_own_temp_sensor') if not is_state('sensor.your_own_temp_sensor','unavailable') else '--' }}°C"

  - obj: "p7b17" # Current weather condition
    properties:
      "text": >
          {% if is_state('weather.ecobee','clear-night') -%}
          Clear night
          {% elif is_state('weather.ecobee','cloudy') -%}
          Cloudy
          {% elif is_state('weather.ecobee','fog') -%}
          Fog
          {% elif is_state('weather.ecobee','hail') -%}
          Hail
          {% elif is_state('weather.ecobee','lightning') -%}
          Lightning
          {% elif is_state('weather.ecobee','lightning-rainy') -%}
          Thunderstorms
          {% elif is_state('weather.ecobee','partlycloudy') -%}
          Partly cloudy
          {% elif is_state('weather.ecobee','pouring') -%}
          Pouring rain
          {% elif is_state('weather.ecobee','rainy') -%}
          Rainy
          {% elif is_state('weather.ecobee','snowy') -%}
          Snowy
          {% elif is_state('weather.ecobee','snowy-rainy') -%}
          Snowy-rainy
          {% elif is_state('weather.ecobee','sunny') -%}
          Sunny
          {% elif is_state('weather.ecobee','windy') -%}
          Windy
          {% elif is_state('weather.ecobee','windy-variant') -%}
          Windy
          {% elif is_state('weather.ecobee','exceptional') -%}
          Exceptional
          {% elif is_state('weather.ecobee','unavailable') -%}
          (not available)
          {% else -%}
          {{ states('weather.ecobee') }}
          {% endif -%}

  - obj: "p7b10"  # tab dots - MAKE SURE YOU UPDATE THIS ONE!!
    event:
      "changed":
        - service: openhasp.command
          target:
            entity_id: openhasp.openhasp1
          data:
            keyword: p7b19.text
            parameters: >
              {% if val == 0 %}
              {{ "#000000 \u2022# #909090 \u2022#" | e }}
              {%-elif val == 1 %}
              {{ "#909090 \u2022# #000000 \u2022#" | e }}
              {% endif %}

  - obj: "p7b21" # Forecast time +2h
    properties:
      "text": >
        {%- if (state_attr('sensor.weather_hourly','forecast') or []) | count > 8 %}
        {%- set update = states('sensor.date') %}
        {%- set midnight = now().replace(hour=0, minute=0, second=0, microsecond=0).timestamp() %}
        {%- set event = as_timestamp(strptime(state_attr('sensor.weather_hourly','forecast')[2]['datetime'], '%Y-%m-%dT%H:%M:%S%z', default='2020-01-00T00:00:00+00:00')) %}
        {%- set delta = ((event - midnight) // 86400) | int %}
        {%- if delta == 0 %}
        Todays
        {%- elif delta == 1 %}
        Tomorrow
        {%- endif %}
        {{- event | timestamp_custom(" %-I %p") }}
        {%- endif %}

  - obj: "p7b22" # Forecast temp +2h
    properties:
      "text": "{{ state_attr('sensor.weather_hourly','forecast')[2]['temperature'] if (state_attr('sensor.weather_hourly','forecast') or []) | count > 8 else '-' }}"

  - obj: "p7b23" # Forecast condition +2h
