    target:
      entity_id: media_player.denon_avr_x1700h_2
denon_tv_mode:
  alias: TV mode
  description: 'Denon to Movie mode: true surround for 5.1 shows, Dolby Surround spread
    for stereo, voices up front.'
  icon: mdi:surround-sound
  mode: single
  sequence:
  - action: media_player.select_sound_mode
    data:
      sound_mode: MOVIE
    target:
      entity_id: media_player.denon_avr_x1700h_2
openhasp2_play_from_library:
  alias: openhasp2 play from library
  description: Called by the Living Room openHASP media page. Finds a Music Assistant
    library item by name and plays it on the speaker picked on the plate, then closes
    the browse panel.
  fields:
    media_type:
      default: playlist
      description: Music Assistant media type
      selector:
        select:
          options:
          - playlist
          - album
          - artist
          - track
          - radio
    name:
      description: Name of the playlist (as shown on the plate)
      required: true
      selector:
        text: {}
  icon: mdi:play-box-multiple
  mode: restart
  sequence:
  - action: music_assistant.get_library
    data:
      config_entry_id: 01M6XSE4DCZ3Z8NPJR9MRAGHMX
      limit: 25
      media_type: '{{ media_type | default(''playlist'') }}'
      search: '{{ name }}'
    response_variable: lib
    note: Search the library (up to 25 matches).
  - variables:
      match: '{{ ((lib[''items''] | selectattr(''name'', ''eq'', name) | list) + lib[''items''])
        | first | default(none) }}'
    note: Prefer an exact name match; otherwise take the first search result.
  - if:
    - condition: template
      value_template: '{{ match is not none and match.uri is defined }}'
    then:
    - action: music_assistant.play_media
      data:
        enqueue: replace
        media_id: '{{ match.uri }}'
        media_type: '{{ media_type | default(''playlist'') }}'
      target:
        entity_id: '{{ states(''input_select.openhasp2_speaker'') }}'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.openhasp2_browse
    note: Close the Playlists & Mixes panel on the plate.
