alexa_msg:
  description: Send a message to all Alexas
  sequence:
  - data:
      entity_id: media_player.all_alexa
      volume_level: '{{ volume }}'
    action: media_player.volume_set
  - delay: 00:00:01
  - data:
      target:
      - media_player.all_alexa
      message: test
      data:
        type: tts
    action: notify.alexa_media
  - delay: 00:00:01
  - data:
      entity_id: media_player.all_alexa
      volume_level: '0.5'
    action: media_player.volume_set
  mode: single
dinnertime:
  alias: Dinnertime
  sequence:
  - data:
      entity_id: media_player.all_alexa
      volume_level: 0.8
    action: media_player.volume_set
  - data:
      data:
        type: tts
      target:
      - media_player.all_alexa
      message: Dinner is Ready
    action: notify.alexa_media
  - data:
      entity_id:
      - media_player.all_alexa
      media_content_type: sound
      media_content_id: amzn_sfx_doorbell_chime_01
    action: media_player.play_media
food_ready:
  alias: food ready
  sequence:
  - data:
      entity_id: media_player.all_alexa
      volume_level: 0.8
    action: media_player.volume_set
  - data:
      data:
        type: tts
      target:
      - media_player.all_alexa
      message: Food is ready
    action: notify.alexa_media
  mode: single
bedtime:
  alias: bedtime
  sequence:
  - data:
      volume_level: 0.8
    action: media_player.volume_set
    target:
      entity_id: media_player.all_alexa
  - data:
      data:
        type: tts
      target:
      - media_player.all_alexa
      message: Ve A Dormir
    action: notify.alexa_media
showers:
  alias: showers
  sequence:
  - data:
      entity_id: media_player.all_alexa
      volume_level: 0.8
    action: media_player.volume_set
  - data:
      data:
        type: tts
      target:
      - media_player.all_alexa
      message: Everyone Take Showers
    action: notify.alexa_media
