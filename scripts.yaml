alexa_msg:
  alias: Alexa message
  description: Announce a message on every Alexa at the given volume, then set
    them back to 50 %. Says "test" if no message is given.
  fields:
    message:
      description: What the Alexas should say
      example: Dinner is ready
      selector:
        text: {}
    volume:
      description: Announcement volume (0.0 - 1.0)
      example: 0.7
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
  sequence:
  - data:
      entity_id: media_player.all_alexa
      volume_level: '{{ volume }}'
    action: media_player.volume_set
  - delay: 00:00:01
  - data:
      target:
      - media_player.all_alexa
      message: '{{ message | default(''test'') }}'
      data:
        type: tts
    action: notify.alexa_media
  - delay: 00:00:01
  - data:
      entity_id: media_player.all_alexa
      volume_level: '0.5'
    action: media_player.volume_set
    note: Put all Alexas back to 50 % volume.
  mode: single
dinnertime:
  alias: Dinnertime
  description: Says "Dinner is Ready" on every Alexa at 80 % volume, then plays
    a doorbell chime.
  sequence:
  - data:
      entity_id: media_player.all_alexa
      volume_level: 0.8
    action: media_player.volume_set
  - data:
      data:
        type: tts
      target:
      - media_player.all_alexa
      message: Dinner is Ready
    action: notify.alexa_media
  - data:
      entity_id:
      - media_player.all_alexa
      media_content_type: sound
      media_content_id: amzn_sfx_doorbell_chime_01
    action: media_player.play_media
food_ready:
  alias: food ready
  description: Says "Food is ready" on every Alexa at 80 % volume.
  sequence:
  - data:
      entity_id: media_player.all_alexa
      volume_level: 0.8
    action: media_player.volume_set
  - data:
      data:
        type: tts
      target:
      - media_player.all_alexa
      message: Food is ready
    action: notify.alexa_media
  mode: single
bedtime:
  alias: bedtime
  description: Says "Ve A Dormir" (go to sleep) on every Alexa at 80 % volume.
  sequence:
  - data:
      volume_level: 0.8
    action: media_player.volume_set
    target:
      entity_id: media_player.all_alexa
  - data:
      data:
        type: tts
      target:
      - media_player.all_alexa
      message: Ve A Dormir
    action: notify.alexa_media
showers:
  alias: showers
  description: Says "Everyone Take Showers" on every Alexa at 80 % volume.
  sequence:
  - data:
      entity_id: media_player.all_alexa
      volume_level: 0.8
    action: media_player.volume_set
  - data:
      data:
        type: tts
      target:
      - media_player.all_alexa
      message: Everyone Take Showers
    action: notify.alexa_media
send_tv_power:
  alias: TV Power
  description: Bedroom TV power on/off. Sends an NEC infrared code through the
    bedroom IR blaster (Tasmota, MQTT topic bedroomIR).
  sequence:
  - data:
      payload: '{"Protocol":"NEC","Bits":32,"Data":"0x02FD48B7"}'
      topic: bedroomIR/cmnd/irSend
    action: mqtt.publish
send_tv_volup:
  alias: TV Volume Up
  description: Bedroom TV volume up via the bedroom IR blaster.
  sequence:
  - action: mqtt.publish
    data:
      topic: bedroomIR/cmnd/irSend
      payload: '{"Protocol":"NEC","Bits":32,"Data":"0x02FD58A7"}'
send_tv_voldn:
  alias: TV Volume Down
  description: Bedroom TV volume down via the bedroom IR blaster.
  sequence:
  - action: mqtt.publish
    data:
      topic: bedroomIR/cmnd/irSend
      payload: '{"Protocol":"NEC","Bits":32,"Data":"0x02FD7887"}'
send_tv_input:
  alias: TV Input
  description: Bedroom TV cycle input via the bedroom IR blaster.
  sequence:
  - action: mqtt.publish
    data:
      topic: bedroomIR/cmnd/irSend
      payload: '{"Protocol":"NEC","Bits":32,"Data":"0x02FDF00F"}'
send_string_rfcode:
  alias: rfsend Command
  description: Send a command to the RF-controlled string lights through the
    Sonoff RF Bridge (Tasmota, MQTT topic rf_bridge). Used by the string-light
    remote on the dashboard. Unknown commands stop with an error.
  fields:
    command:
      description: What to tell the string lights to do
      example: 'on'
      selector:
        select:
          options:
          - 'on'
          - 'off'
          - red
          - green
          - blue
          - white
          - lime
          - cyan
          - purple
          - orange
          - dim_up
          - dim_dn
          - fade3
          - jump3
          - fade7
          - jump7
          - auto
          - flash
          - speed_up
          - speed_dn
  variables:
    rf_codes:
      'off': AAB021030800FA028A16122818080818081818080808181808080808080808080808180855
      'on': AAB0230408010E026C00AA16303818080818081818080808181828080808080808080828281855
      red: AAB021030800FA028A163A2818080818081818080808181808080808080808080818081855
      green: '#FFFF05'
      blue: '#FFFF06'
      white: '#FFFF07'
      lime: '#FFFF08'
      cyan: '#FFFF09'
      purple: '#FFFF0A'
      orange: '#FFFF0B'
      dim_up: '#FFFF0C'
      dim_dn: '#FFFF0F'
      fade3: '#FFFF0D'
      jump3: '#FFFF0E'
      fade7: '#FFFF10'
      jump7: '#FFFF11'
      auto: '#FFFF13'
      flash: '#FFFF14'
      speed_up: '#FFFF12'
      speed_dn: '#FFFF15'
  sequence:
  - if:
    - condition: template
      value_template: '{{ command not in rf_codes }}'
    then:
    - stop: Unknown string-light command
      error: true
    note: Fail visibly in the trace instead of sending junk over RF.
  - data:
      topic: '{{ ''cmnd/rf_bridge/rfraw'' if rf_codes[command].startswith(''AAB0'')
        else ''cmnd/rf_bridge/rfcode'' }}'
      payload: '{{ rf_codes[command] }}'
    action: mqtt.publish
    note: 'Two code types: AAB0... are raw captures and go to the RfRaw command;
      #FFFFxx are 24-bit codes and go to the RfCode command (they used to go to
      RfRaw, which ignores them). If a color still does nothing, capture it from
      the remote with RfRaw 177 and replace its #FFFF code here.'
code_button:
  alias: code_button
  description: 'Alarm keypad logic for the openHASP plates (page 8 on plate 1,
    page 3 on plate 2). Each key press runs this once. Digit keys shift into
    input_number.alarmcode_1..4 (newest digit in _1). Pressing Arm Away / Arm
    Vaca / Arm Home / Arm Night / Disarm sends the 4-digit code to
    alarm_control_panel.alarm, then clears the digits back to -1. Arm buttons
    only work while the alarm is disarmed. Delays come from the manual panel
    (config_folders/alarm/konnected.yaml): Home has none; Away, Night and
    Vacation give 20 s to leave and 60 s to disarm on entry.'
  fields:
    text:
      description: Label of the key pressed on the plate (a digit, or Arm Away /
        Arm Vaca / Arm Home / Arm Night / Disarm)
      example: '5'
      selector:
        text: {}
    value:
      description: Key index sent by the plate (not used)
    haspname:
      description: Plate name (not used)
    haspMAC:
      description: Plate MAC address (not used)
  variables:
    codelength: 4
    alarmpanel: alarm_control_panel.alarm
    armhomeservice: alarm_arm_home
    armnightservice: alarm_arm_night
    armawayservice: alarm_arm_away
    armvacaservice: alarm_arm_vacation
    disarmservice: alarm_disarm
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{(text == ''Arm Away'') and (states(alarmpanel) == ''disarmed'')}}'
        note: Arm Away pressed while disarmed.
      sequence:
      - data:
          entity_id: alarm_control_panel.alarm
          code: '{%- set code = namespace() -%}  {%- set code.value = states("input_number.alarmcode_"
            ~ codelength)|int -%}  {%- for i in range(1,codelength) -%} {%- set code.value
            =  code.value|int * 10 + (states("input_number.alarmcode_" ~ (codelength
            - i))|int) -%} {%- endfor -%} {{code.value|int}}'
        action: '{{''alarm_control_panel.'' ~ armawayservice}}'
        note: Builds the code from alarmcode_4 (first digit) down to alarmcode_1 (last digit).
      - repeat:
          count: '{{codelength}}'
          sequence:
          - data:
              entity_id: input_number.alarmcode_{{repeat.index}}
              value: -1
            action: input_number.set_value
        note: Clear the entered digits.
    - conditions:
      - condition: template
        value_template: '{{(text == ''Arm Vaca'') and (states(alarmpanel) == ''disarmed'')}}'
        note: Arm Vacation pressed while disarmed.
      sequence:
      - data:
          entity_id: alarm_control_panel.alarm
          code: '{%- set code = namespace() -%}  {%- set code.value = states("input_number.alarmcode_"
            ~ codelength)|int -%}  {%- for i in range(1,codelength) -%} {%- set code.value
            =  code.value|int * 10 + (states("input_number.alarmcode_" ~ (codelength
            - i))|int) -%} {%- endfor -%} {{code.value|int}}'
        action: '{{''alarm_control_panel.'' ~ armvacaservice}}'
      - repeat:
          count: '{{codelength}}'
          sequence:
          - data:
              entity_id: input_number.alarmcode_{{repeat.index}}
              value: -1
            action: input_number.set_value
        note: Clear the entered digits.
    - conditions:
      - condition: template
        value_template: '{{(text == ''Arm Home'') and (states(alarmpanel) == ''disarmed'')}}'
        note: Arm Home pressed while disarmed.
      sequence:
      - data:
          entity_id: alarm_control_panel.alarm
          code: '{%- set code = namespace() -%}  {%- set code.value = states("input_number.alarmcode_"
            ~ codelength)|int -%}  {%- for i in range(1,codelength) -%} {%- set code.value
            =  code.value|int * 10 + (states("input_number.alarmcode_" ~ (codelength
            - i))|int) -%} {%- endfor -%} {{code.value|int}}'
        action: '{{''alarm_control_panel.'' ~ armhomeservice}}'
      - repeat:
          count: '{{codelength}}'
          sequence:
          - data:
              entity_id: input_number.alarmcode_{{repeat.index}}
              value: -1
            action: input_number.set_value
        note: Clear the entered digits.
    - conditions:
      - condition: template
        value_template: '{{(text == ''Arm Night'') and (states(alarmpanel) == ''disarmed'')}}'
        note: Arm Night pressed while disarmed.
      sequence:
      - data:
          entity_id: alarm_control_panel.alarm
          code: '{%- set code = namespace() -%}  {%- set code.value = states("input_number.alarmcode_"
            ~ codelength)|int -%}  {%- for i in range(1,codelength) -%} {%- set code.value
            =  code.value|int * 10 + (states("input_number.alarmcode_" ~ (codelength
            - i))|int) -%} {%- endfor -%} {{code.value|int}}'
        action: '{{''alarm_control_panel.'' ~ armnightservice}}'
      - repeat:
          count: '{{codelength}}'
          sequence:
          - data:
              entity_id: input_number.alarmcode_{{repeat.index}}
              value: -1
            action: input_number.set_value
        note: Clear the entered digits.
    - conditions:
      - condition: template
        value_template: '{{text == ''Disarm'' }}'
        note: Disarm pressed (works in any state).
      sequence:
      - data:
          entity_id: alarm_control_panel.alarm
          code: '{%- set code = namespace() -%}  {%- set code.value = states("input_number.alarmcode_"
            ~ codelength)|int -%}  {%- for i in range(1,codelength) -%} {%- set code.value
            =  code.value|int * 10 + (states("input_number.alarmcode_" ~ (codelength
            - i))|int) -%} {%- endfor -%} {{code.value|int}}'
        action: '{{''alarm_control_panel.'' ~ disarmservice}}'
      - repeat:
          count: '{{codelength}}'
          sequence:
          - data:
              entity_id: input_number.alarmcode_{{repeat.index}}
              value: -1
            action: input_number.set_value
        note: Clear the entered digits.
    default:
    - repeat:
        count: '{{(codelength|int) - 1}}'
        sequence:
        - action: input_number.set_value
          data:
            entity_id: input_number.alarmcode_{{(codelength|int) - repeat.index +
              1}}
            value: '{{states("input_number.alarmcode_" ~ ((codelength|int) - repeat.index))|int}}'
      note: 'A digit was pressed: shift stored digits up one slot (3->4, 2->3, 1->2).'
    - action: input_number.set_value
      data:
        entity_id: input_number.alarmcode_1
        value: '{{text|int}}'
      note: Store the new digit in slot 1.
play_youtube:
  alias: Play YouTube
  description: 'Living room: TV on and to HDMI 2 (via SmartThings), Denon to Apple
    TV, then open YouTube on the Apple TV.'
  icon: mdi:youtube
  mode: single
  sequence:
  - action: media_player.turn_on
    note: SmartThings (cloud) entity; the local Samsung integration can't power this
      TV on.
    target:
      entity_id: media_player.living_room_television_3
  - action: media_player.turn_on
    target:
      entity_id: media_player.denon_avr_x1700h_2
  - continue_on_timeout: true
    note: Continues immediately if the TV is already on.
    timeout:
      seconds: 30
    wait_template: '{{ is_state(''media_player.living_room_television_3'', ''on'')
      }}'
  - if:
    - condition: state
      entity_id: media_player.living_room_television_3
      state: 'off'
    then:
    - action: media_player.turn_on
      note: Retry once if the TV ignored the first power-on (e.g. still shutting down).
      target:
        entity_id: media_player.living_room_television_3
    - continue_on_timeout: true
      timeout:
        seconds: 30
      wait_template: '{{ is_state(''media_player.living_room_television_3'', ''on'')
        }}'
  - delay:
      seconds: 4
    note: Let the TV finish booting before changing input.
  - action: media_player.select_source
    continue_on_error: true
    data:
      source: hdmi2
    note: Denon is plugged into TV HDMI 2.
    target:
      entity_id: media_player.living_room_television_3
  - action: media_player.select_source
    data:
      source: Apple TV
    target:
      entity_id: media_player.denon_avr_x1700h_2
  - action: remote.turn_on
    note: Wakes the Apple TV.
    target:
      entity_id: remote.living_room_living_room
  - delay:
      seconds: 4
  - action: media_player.select_source
    data:
      source: YouTube
    target:
      entity_id: media_player.living_room_living_room
living_room_media_off:
  alias: Living Room Media Off
  description: Turns off the living room Apple TV, Denon, and TV (TV via SmartThings).
  icon: mdi:power
  mode: single
  sequence:
  - action: remote.turn_off
    continue_on_error: true
    target:
      entity_id: remote.living_room_living_room
  - action: media_player.turn_off
    continue_on_error: true
    target:
      entity_id: media_player.denon_avr_x1700h_2
  - action: media_player.turn_off
    continue_on_error: true
    target:
      entity_id: media_player.living_room_television_3
play_youtube_samsung:
  alias: Play YouTube on Samsung
  description: 'Living room: TV on (SmartThings), Denon to TV Audio, then open the
    Samsung''s built-in YouTube app via the TV''s local REST API.'
  icon: mdi:youtube
  mode: single
  sequence:
  - action: media_player.turn_on
    target:
      entity_id: media_player.living_room_television_3
  - action: media_player.turn_on
    target:
      entity_id: media_player.denon_avr_x1700h_2
  - continue_on_timeout: true
    note: Continues immediately if the TV is already on.
    timeout:
      seconds: 30
    wait_template: '{{ is_state(''media_player.living_room_television_3'', ''on'')
      }}'
  - if:
    - condition: state
      entity_id: media_player.living_room_television_3
      state: 'off'
    then:
    - action: media_player.turn_on
      note: Retry once if the TV ignored the first power-on.
      target:
        entity_id: media_player.living_room_television_3
    - continue_on_timeout: true
      timeout:
        seconds: 30
      wait_template: '{{ is_state(''media_player.living_room_television_3'', ''on'')
        }}'
  - action: media_player.select_source
    data:
      source: TV Audio
    target:
      entity_id: media_player.denon_avr_x1700h_2
  - delay:
      seconds: 5
    note: Let the TV finish booting so its app API is listening.
  - action: shell_command.samsung_tv_launch_youtube
    note: POST to the TV's port 8001 API; YouTube app id 111299001912.
denon_music_mode:
